# Start everything with:  docker compose up --build
# Values come from a root .env file if present (copy .env.example); the defaults below are for local development only.
services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-cineopt_root_dev}
      MYSQL_DATABASE: ${DB_NAME:-cineopt}
      MYSQL_USER: ${DB_USER:-cineopt}
      MYSQL_PASSWORD: ${DB_PASSWORD:-cineopt_dev_pw}
    volumes:
      - mysql_data:/var/lib/mysql
      # executed in file-name order on the first start of an empty volume
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./database/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    ports:
      - "${MYSQL_HOST_PORT:-3308}:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  algorithm-engine:
    build: ./algorithm-engine
    ports:
      - "${ENGINE_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 5

  backend:
    build: ./backend
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 5000
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: ${DB_USER:-cineopt}
      DB_PASSWORD: ${DB_PASSWORD:-cineopt_dev_pw}
      DB_NAME: ${DB_NAME:-cineopt}
      JWT_SECRET: ${JWT_SECRET:-dev-only-secret-please-change-0123456789abcdef}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      ALGORITHM_ENGINE_URL: http://algorithm-engine:8000
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
    depends_on:
      mysql:
        condition: service_healthy
      algorithm-engine:
        condition: service_healthy
    ports:
      - "${BACKEND_PORT:-5000}:5000"

  frontend:
    build:
      context: ./frontend
      args:
        # the browser calls the API through the published backend port
        VITE_API_URL: ${VITE_API_URL:-http://localhost:5000/api}
        VITE_CURRENCY: ${VITE_CURRENCY:-$$}
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-5173}:5173"

volumes:
  mysql_data:
