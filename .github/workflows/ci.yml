name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run build

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run check
      - run: npm test

  algorithm-engine:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: algorithm-engine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q
      - name: Benchmark smoke test
        run: python -m app.services.benchmark --sizes 100 500 --out /tmp/bench

  docker:
    runs-on: ubuntu-latest
    needs: [frontend, backend, algorithm-engine]
    steps:
      - uses: actions/checkout@v4
      - run: docker compose build
